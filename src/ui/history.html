<div id="dmh-tools">
<input id="dmh-search" aria-label="Search DM history" type="search" placeholder="Search name, username, user ID, or channel ID">
<button id="dmh-refresh" class="dmh-button blue">Refresh & Verify</button>
<button id="dmh-import" class="dmh-button">Import Data Package</button>
<button id="dmh-clear" class="dmh-button red">Clear Saved</button>
<button id="dmh-delete-all" class="dmh-button red" hidden>Delete All</button><button id="dmh-stop" class="dmh-button" disabled hidden>Stop</button>
<input id="dmh-folder" type="file" webkitdirectory directory multiple>
</div>
<div id="dmh-summary">Loading saved history…</div><div id="dmh-list"></div>
<div id="dmh-footer">
<button id="dmh-prev" class="dmh-button">Previous</button><span id="dmh-page">Page 1</span>
<input id="dmh-page-input" aria-label="History page" type="number" min="1" value="1"><button id="dmh-page-go" class="dmh-button">Go</button>
<button id="dmh-next" class="dmh-button">Next</button>
</div>

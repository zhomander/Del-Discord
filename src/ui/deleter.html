<div id="dmd-tabs">
<button class="dmd-tab active" data-view="messages">Messages</button>
<button class="dmd-tab" data-view="reactions">Reactions</button>
<button class="dmd-tab" data-view="multi">Queue</button>
<button class="dmd-tab" data-view="history">DM History</button>

</div>
<div id="dmd-messages" class="dmd-view"><div class="dmd-segments" id="dmd-message-modes" aria-label="Conversation type"><button type="button" data-mode="dm" class="active">DMs</button><button type="button" data-mode="channel">Channel</button><button type="button" data-mode="forums">Forum/Thread</button></div><div id="dmd-thread-target" class="dmd-field" hidden><label for="dmd-thread-target-kind">Select targets</label><select id="dmd-thread-target-kind"><option value="forums">Browse forum</option><option value="thread">Thread IDs</option></select></div><div class="dmd-grid"><div class="dmd-field"><label for="dmd-action">Action</label><select id="dmd-action"><option value="delete">Delete messages</option><option value="overwrite">Overwrite message text</option><option value="preserve">Remove text, keep URLs/images</option></select></div>
<div class="dmd-field"><label for="dmd-order">Message order</label><select id="dmd-order"><option value="desc">Newest Messages First</option><option value="asc">Oldest Messages First</option></select></div>

<div id="dmd-overwrite-field" class="dmd-field dmd-wide" hidden><label for="dmd-overwrite-text">Replacement text</label><textarea id="dmd-overwrite-text" maxlength="2000" rows="3" placeholder="Text to replace each matching message"></textarea><div class="dmd-note">Overwrites text only. Messages and attached files remain; replacement text will not send mention notifications.</div></div>
</div><details class="dmd-filter-group"><summary>Conversation & authorization</summary><div class="dmd-grid"><div class="dmd-field"><label>Authorization <button id="dmd-get-token" class="dmd-btn dmd-small">GET</button></label><input id="dmd-token" type="password" autocomplete="off" placeholder="Authorization token"></div>
<div class="dmd-field"><label for="dmd-author" class="dmd-identity-label">Author(s) <span id="dmd-user-avatar" class="dmd-identity-avatar" hidden></span></label><input id="dmd-author" type="text" placeholder="User ID, user ID"></div>
<div class="dmd-field"><label for="dmd-guild" class="dmd-identity-label">Guild <span id="dmd-guild-avatar" class="dmd-identity-avatar" hidden></span></label><input id="dmd-guild" type="text" placeholder="@me or server ID"></div>
<div class="dmd-field"><label>Channel(s)</label><input id="dmd-channel" type="text" placeholder="Channel ID, channel ID"></div></div></details><details class="dmd-filter-group"><summary>Date & message range</summary><div class="dmd-grid"><div class="dmd-field"><label>After date</label><input id="dmd-after" type="datetime-local"></div>
<div class="dmd-field"><label>Before date</label><input id="dmd-before" type="datetime-local"></div>
<div class="dmd-field"><label>After message</label><input id="dmd-after-message" type="text" placeholder="Message ID or Discord link"></div>
<div class="dmd-field"><label>Before message</label><input id="dmd-before-message" type="text" placeholder="Message ID or Discord link"></div></div></details><details class="dmd-filter-group"><summary>Text & message filters</summary><div class="dmd-grid"><div class="dmd-field"><label for="dmd-content">Text filter</label><input id="dmd-content" type="text" placeholder="Optional text"><select id="dmd-text-mode" aria-label="Text filter behavior"><option value="include">Only matching</option><option value="exclude">Keep matching text (inverse)</option></select></div>
<div class="dmd-field"><label for="dmd-link-mode">Links</label><select id="dmd-link-mode"><option value="any">Any messages</option><option value="with">Only with links</option><option value="without">Keep messages with links</option></select><div class="dmd-pattern-options"><div><label class="dmd-help-label" for="dmd-regex-flags" tabindex="0" aria-describedby="dmd-regex-flags-help">Flags <span class="dmd-help-icon" aria-hidden="true">?</span><span class="dmd-tooltip" id="dmd-regex-flags-help" role="tooltip">Regex flags change how a pattern matches. i: ignore case · m: multiline · s: dot matches newlines · u: Unicode. Leave blank for case-sensitive matching.</span></label><input id="dmd-regex-flags" title="Regex flags change how a pattern matches. i: ignore case · m: multiline · s: dot matches newlines · u: Unicode. Leave blank for case-sensitive matching." aria-describedby="dmd-regex-flags-help" type="text" value="i" placeholder="i" maxlength="4" aria-label="Text regex flags"></div><div><label for="dmd-regex-mode">Match behavior</label><select id="dmd-regex-mode" aria-label="Text regex behavior"><option value="include">Only matching</option><option value="exclude">Keep matching</option></select></div></div></div>
<div class="dmd-field"><label for="dmd-file-mode">Files</label><select id="dmd-file-mode"><option value="any">Any messages</option><option value="with">Only with files</option><option value="without">Keep messages with files</option></select></div>
<div class="dmd-field"><label for="dmd-pinned-mode">Pinned messages</label><select id="dmd-pinned-mode"><option value="without">Keep pinned messages</option><option value="any">Include pinned messages</option><option value="with">Only pinned messages</option></select></div>
<div class="dmd-field"><label>Search options</label><label class="dmd-check"><input id="dmd-nsfw" type="checkbox"> Include NSFW search results</label></div>
<div class="dmd-field"><label for="dmd-text-regex">Text regex</label><input id="dmd-text-regex" type="text" maxlength="1000" placeholder="Optional pattern, without /slashes/"></div></div></details><details class="dmd-filter-group"><summary>Filename, extension & URL filters</summary><div class="dmd-grid"><div class="dmd-field"><label for="dmd-filename">File/URL filename contains</label><input id="dmd-filename" type="text" placeholder="Optional filename text"></div>
<div class="dmd-field"><label for="dmd-asset-regex">File/URL regex</label><input id="dmd-asset-regex" type="text" maxlength="1000" placeholder="Optional filename or URL pattern"></div><div class="dmd-field"><label for="dmd-extensions">Extensions</label><input id="dmd-extensions" type="text" placeholder="png, jpg, zip"></div><div class="dmd-field"><div class="dmd-pattern-options"><div><label class="dmd-help-label" for="dmd-asset-regex-flags" tabindex="0" aria-describedby="dmd-asset-regex-flags-help">Flags <span class="dmd-help-icon" aria-hidden="true">?</span><span class="dmd-tooltip" id="dmd-asset-regex-flags-help" role="tooltip">Regex flags change how a pattern matches. i: ignore case · m: multiline · s: dot matches newlines · u: Unicode. Leave blank for case-sensitive matching.</span></label><input id="dmd-asset-regex-flags" title="Regex flags change how a pattern matches. i: ignore case · m: multiline · s: dot matches newlines · u: Unicode. Leave blank for case-sensitive matching." aria-describedby="dmd-asset-regex-flags-help" type="text" value="i" placeholder="i" maxlength="4" aria-label="File/URL regex flags"></div><div><label for="dmd-asset-mode">Match behavior</label><select id="dmd-asset-mode" aria-label="File/URL filter behavior"><option value="include">Only matching</option><option value="exclude">Keep matching</option></select></div></div></div></div></details><div class="dmd-scan-option"><div class="dmd-field"><label class="dmd-check"><input id="dmd-collect-all" type="checkbox" checked> Scan all matches before cleanup</label></div></div><div class="dmd-actions">
<button id="dmd-start" class="dmd-btn dmd-green">Start</button><button id="dmd-stop" class="dmd-btn dmd-red" disabled>Stop</button><button id="dmd-clear" class="dmd-btn">Clear log</button>
<button id="dmd-export-log" class="dmd-btn">Export Log</button><button id="dmd-export-conversation" class="dmd-btn">Export Conversation</button>
</div></div>
<div id="dmd-reactions" class="dmd-view" style="display:none"><div class="dmd-grid">
<div class="dmd-field"><label>Channel(s)</label><input id="dmd-rx-channel" type="text" placeholder="Channel ID, channel ID"></div>
<div class="dmd-field"><label>Start at Message ID/Date</label><input id="dmd-rx-start" type="text" placeholder="Optional"></div>
<div class="dmd-field"><label>Messages to Scan</label><input id="dmd-rx-limit" type="number" min="1" max="${MAX_REACTION_SCAN}" value="1000"></div>
<div class="dmd-field"><label for="dmd-rx-filter">Reaction IDs</label><input id="dmd-rx-filter" type="text" placeholder="Blank for all reactions" title="Comma-separated emoji IDs or custom emoji tags"></div>
<div class="dmd-field"><label>Filter</label><label class="dmd-check"><input id="dmd-rx-skipown" type="checkbox"> Skip messages you wrote</label></div>
</div><div class="dmd-actions"><button id="dmd-rx-go" class="dmd-btn dmd-green">Scan and remove</button><button id="dmd-rx-stop" class="dmd-btn dmd-red" disabled>Stop</button></div></div>
<div id="dmd-multi" class="dmd-view" style="display:none"><div class="dmd-segments" id="dmd-queue-modes" aria-label="Queue type"><button type="button" data-mode="multi" class="active">Conversations</button><button type="button" data-mode="ids">Message IDs</button></div><div class="dmd-field"><label for="dmd-multi-current">Current DM / Channel</label><div class="dmd-add-row"><input id="dmd-multi-current" type="text" readonly><button id="dmd-multi-add-current" class="dmd-btn">Add current</button></div></div>
<details class="dmd-filter-group"><summary>Add conversation by IDs</summary><div class="dmd-add-row"><div class="dmd-field"><label for="dmd-multi-guild">Guild / DM ID</label><input id="dmd-multi-guild" type="text" placeholder="@me or server ID"></div><div class="dmd-field"><label for="dmd-multi-channel">Channel(s)</label><input id="dmd-multi-channel" type="text" placeholder="Channel ID, channel ID"></div><button id="dmd-multi-add-manual" class="dmd-btn">Add IDs</button></div></details>
<div id="dmd-multi-list"></div><div class="dmd-actions"><button id="dmd-multi-start" class="dmd-btn dmd-green">Start Queue</button><button id="dmd-multi-stop" class="dmd-btn dmd-red" disabled>Stop Queue</button><button id="dmd-multi-clear" class="dmd-btn">Clear Queue</button><button id="dmd-multi-export" class="dmd-btn">Export Conversation</button></div>
</div>
<div id="dmd-ids" class="dmd-view" style="display:none"><div class="dmd-field"><label for="dmd-id-input">Message IDs or links</label><textarea id="dmd-id-input" rows="5" placeholder="Paste message IDs or Discord message links, one per line"></textarea></div>

<div class="dmd-actions"><button id="dmd-id-import" class="dmd-btn">Import ID file</button><button id="dmd-id-package" class="dmd-btn">Import Data Package</button><button id="dmd-id-clear" class="dmd-btn">Clear IDs</button><span id="dmd-id-count" class="dmd-muted">No imported IDs</span></div>
<input id="dmd-id-files" type="file" accept=".json,.csv,.txt" multiple hidden><input id="dmd-id-folder" type="file" webkitdirectory directory multiple hidden>
<div class="dmd-actions"><button id="dmd-id-start" class="dmd-btn dmd-green">Run IDs</button><button id="dmd-id-stop" class="dmd-btn dmd-red" disabled>Stop</button></div>
</div>
<div id="dmd-forums" class="dmd-view" style="display:none"><div class="dmd-grid"><div class="dmd-field"><label for="dmd-forum-id">Forum channel ID</label><input id="dmd-forum-id" type="text" placeholder="Forum or media channel ID"></div><div class="dmd-field"><label class="dmd-check"><input id="dmd-forum-archived" type="checkbox" checked> Include archived threads</label></div></div>
<div class="dmd-actions"><button id="dmd-forum-load" class="dmd-btn">Load threads</button><button id="dmd-forum-stop" class="dmd-btn dmd-red" disabled>Stop</button></div>
<div class="dmd-field"><label for="dmd-forum-list">Select threads</label><select id="dmd-forum-list" multiple size="8"></select></div>

<div class="dmd-actions"><button id="dmd-forum-run" class="dmd-btn dmd-green">Clean selected threads</button><button id="dmd-forum-queue" class="dmd-btn">Add selected to queue</button><button id="dmd-forum-export" class="dmd-btn">Export Conversation</button></div>
</div>
<div id="dmd-progress-dock" aria-label="Cleanup progress"><div class="dmd-progress-area" data-progress-view="messages"><progress id="dmd-progress" max="1" value="0" aria-label="messages progress"></progress><div class="dmd-progress-meta"><span id="dmd-forum-status" class="dmd-muted"></span><span id="dmd-pct">0%</span></div></div>
<div class="dmd-progress-area" data-progress-view="multi" hidden><progress id="dmd-multi-progress" max="1" value="0" aria-label="multi progress"></progress><div class="dmd-progress-meta"><span id="dmd-multi-count" class="dmd-muted">0 queued</span><span id="dmd-multi-pct">0%</span></div><div id="dmd-multi-status" class="dmd-muted"></div></div>
<div class="dmd-progress-area" data-progress-view="ids" hidden><progress id="dmd-id-progress" max="1" value="0" aria-label="ids progress"></progress><div class="dmd-progress-meta"><span id="dmd-id-status" class="dmd-muted"></span><span id="dmd-id-pct">0%</span></div></div>
<div class="dmd-progress-area" data-progress-view="reactions" hidden><progress id="dmd-rx-progress" max="1" value="0" aria-label="reactions progress"></progress><div class="dmd-progress-meta"><span id="dmd-rx-phase" class="dmd-muted"></span><span id="dmd-rx-pct">0%</span></div></div>
<div class="dmd-progress-area" data-progress-view="history" hidden><progress id="dmh-progress" max="1" value="0" aria-label="DM cleanup progress"></progress><div class="dmd-progress-meta"><span id="dmh-progress-status"></span><span id="dmh-pct">0%</span></div></div>
</div>
<pre id="dmd-log" role="log" aria-label="Logs" aria-live="polite"></pre>
<div id="dmd-resize-left" data-resize-corner="left" title="Resize from bottom left" aria-label="Resize from bottom left"></div><div id="dmd-resize-handle" data-resize-corner="right" title="Resize from bottom right" aria-label="Resize from bottom right"></div>
